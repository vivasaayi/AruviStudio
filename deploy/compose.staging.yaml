services:
  app:
    image: ${APP_IMAGE:?Supply the tested product image}
    ports:
      - "${BIND_ADDRESS}:${PUBLISHED_PORT}:${APP_PORT}"
    environment:
      ARUVI_MOBILE_API_TOKEN: ${ARUVI_MOBILE_API_TOKEN:?Missing environment token}
      ARUVI_MCP_API_TOKEN: ${ARUVI_MCP_API_TOKEN:?Missing environment token}
      ARUVI_LLM_CONFIG_PATH: /data/llm-config.json
    volumes:
      - data:/data
      - repositories:/repositories
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8787 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && read -r line <&3 && [[ $$line == *200* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  data: {}
  repositories: {}
