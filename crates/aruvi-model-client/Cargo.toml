[package]
name = "aruvi-model-client"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Reusable model service clients for Aruvi applications"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
