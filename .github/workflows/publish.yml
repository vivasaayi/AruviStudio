name: Build Desktop Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.2.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-candidate-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      git_sha: ${{ steps.metadata.outputs.git_sha }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Capture release metadata
        id: metadata
        shell: bash
        run: echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        run: node scripts/ci/validate-release-version.mjs "$RELEASE_TAG"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-quality-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: release-quality-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run complete quality gate
        run: npm run test:all

      - name: Verify production frontend build
        run: npm run build

  build-candidate:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            bundle_label: macos-arm64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - runner: macos-15-intel
            bundle_label: macos-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - runner: ubuntu-22.04
            bundle_label: linux-x86_64
            target: ""
            args: ""
          - runner: windows-2022
            bundle_label: windows-x86_64
            target: ""
            args: ""

    runs-on: ${{ matrix.runner }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        if: matrix.target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust target
        if: matrix.target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.bundle_label }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.bundle_label }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure macOS signing mode
        id: macos_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_SECRET: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE_SECRET" && -n "$APPLE_SIGNING_IDENTITY_SECRET" ]]; then
            echo "identity=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_OUTPUT"
            echo "has_certificate=true" >> "$GITHUB_OUTPUT"
          else
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "has_certificate=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$APPLE_API_ISSUER_SECRET" && -n "$APPLE_API_KEY_SECRET" && -n "$APPLE_API_KEY_P8_SECRET" ]]; then
            echo "has_notary_api=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notary_api=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple Developer certificate
        if: runner.os == 'macOS' && steps.macos_signing.outputs.has_certificate == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 -d > certificate.p12 || printf '%s' "$APPLE_CERTIFICATE" | base64 -D > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Write App Store Connect API key
        id: notarization_key
        if: runner.os == 'macOS' && steps.macos_signing.outputs.has_notary_api == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Build and upload notarized draft desktop bundles
        if: runner.os == 'macOS' && steps.macos_signing.outputs.has_certificate == 'true' && steps.macos_signing.outputs.has_notary_api == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ steps.notarization_key.outputs.path }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: AruviStudio ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Desktop release candidate for `${{ inputs.tag || github.ref_name }}`.

            Tested commit: `${{ needs.quality-gate.outputs.git_sha }}`

            This release remains a draft until the exact uploaded artifacts pass acceptance testing and are promoted by the separate production workflow.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and upload test draft desktop bundles
        if: runner.os != 'macOS' || steps.macos_signing.outputs.has_certificate != 'true' || steps.macos_signing.outputs.has_notary_api != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && steps.macos_signing.outputs.identity || '' }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: AruviStudio ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Desktop release candidate for `${{ inputs.tag || github.ref_name }}`.

            Tested commit: `${{ needs.quality-gate.outputs.git_sha }}`

            This release remains a draft until the exact uploaded artifacts pass acceptance testing and are promoted by the separate production workflow.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  finalize-candidate:
    needs:
      - quality-gate
      - build-candidate
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TESTED_GIT_SHA: ${{ needs.quality-gate.outputs.git_sha }}

    steps:
      - name: Download candidate artifacts
        run: |
          mkdir -p candidate-assets
          gh release download "$RELEASE_TAG" --dir candidate-assets

      - name: Create candidate manifest and checksums
        shell: bash
        run: |
          asset_count="$(find candidate-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$asset_count" -lt 1 ]]; then
            echo "Release $RELEASE_TAG has no candidate artifacts." >&2
            exit 1
          fi

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg gitSha "$TESTED_GIT_SHA" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, gitSha: $gitSha, createdAt: $createdAt, status: "release-candidate"}' \
            > candidate-assets/RELEASE_MANIFEST.json

          find candidate-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#candidate-assets/##' > candidate-assets/SHA256SUMS.txt
          test -s candidate-assets/SHA256SUMS.txt

      - name: Attach candidate verification metadata
        run: |
          gh release upload "$RELEASE_TAG" \
            candidate-assets/RELEASE_MANIFEST.json \
            candidate-assets/SHA256SUMS.txt \
            --clobber
